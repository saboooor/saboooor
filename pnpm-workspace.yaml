onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - workerd
  - sharp
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
blockExoticSubdeps: false
minimumReleaseAge: 0